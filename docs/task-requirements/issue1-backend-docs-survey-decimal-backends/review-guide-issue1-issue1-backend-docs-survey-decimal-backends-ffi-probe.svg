<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif">
<title>ffi プローブの組み立てと実行: run.sh が Probe.aum を一時ディレクトリへ複写して austral compile で ffi.c を出し、gcc が ffi.c と shim.c を別の翻訳単位として mpdecimal とリンクし、実行時は Zustral の main がポインタだけをシムへ渡す</title>
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect width="900" height="470" fill="#ffffff"/>
<g font-size="13" fill="#1f2328" text-anchor="middle">
<rect x="20" y="20" width="160" height="50" rx="8" fill="#e8f1fb" stroke="#0b5cad"/><text x="100" y="50">run.sh build ffi</text>
<rect x="230" y="20" width="200" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/><text x="330" y="42">austral compile</text><text x="330" y="60" font-size="11" fill="#57606a">一時ディレクトリで起動</text>
<rect x="480" y="20" width="160" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/><text x="560" y="50">ffi.c（生成 C）</text>
<rect x="690" y="20" width="190" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/><text x="785" y="42">gcc -fwrapv</text><text x="785" y="60" font-size="11" fill="#57606a">ffi.c + shim.c + -lmpdec</text>
<rect x="690" y="110" width="190" height="56" rx="8" fill="#fff8e5" stroke="#7d4e00"/><text x="785" y="133">shim.c は別の翻訳単位</text><text x="785" y="152" font-size="11">mpdecimal.h を読むのはここだけ</text>
</g>
<g stroke="#57606a" stroke-width="2" marker-end="url(#b)">
<line x1="180" y1="45" x2="226" y2="45"/><line x1="430" y1="45" x2="476" y2="45"/><line x1="640" y1="45" x2="686" y2="45"/>
<line x1="785" y1="110" x2="785" y2="74"/>
</g>
<text x="20" y="205" font-size="14" font-weight="bold" fill="#1f2328">実行時（Probe.aum の main）</text>
<g font-size="13" fill="#1f2328" text-anchor="middle">
<rect x="20" y="220" width="200" height="40" rx="8" fill="#e8f1fb" stroke="#0b5cad"/><text x="120" y="245">Zustral main</text>
<rect x="350" y="220" width="200" height="40" rx="8" fill="#fff8e5" stroke="#7d4e00"/><text x="450" y="245">shim_* （int32_t を返す）</text>
<rect x="680" y="220" width="200" height="40" rx="8" fill="#f6f8fa" stroke="#57606a"/><text x="780" y="245">libmpdec / libgcc の BID</text>
</g>
<g stroke="#c9d1d9" stroke-width="1.5" stroke-dasharray="4 4"><line x1="120" y1="260" x2="120" y2="455"/><line x1="450" y1="260" x2="450" y2="455"/><line x1="780" y1="260" x2="780" y2="455"/></g>
<g stroke="#57606a" stroke-width="2" marker-end="url(#b)">
<line x1="120" y1="290" x2="776" y2="290"/>
<line x1="120" y1="335" x2="446" y2="335"/>
<line x1="450" y1="355" x2="776" y2="355"/>
<line x1="120" y1="400" x2="446" y2="400"/>
<line x1="450" y1="425" x2="776" y2="425"/>
</g>
<g font-size="12" fill="#1f2328">
<text x="130" y="283">Mpd_Qnew() → mpd_qnew を直接（戻り値 Address[Nat8]）</text>
<text x="130" y="328">Mpd_Set / Mpd_Add(Address[Nat8] …)</text>
<text x="460" y="348">mpd_qset_string / mpd_qadd（void を返す）</text>
<text x="130" y="393">D128_Set / D128_Add(16バイトの領域の Address)</text>
<text x="460" y="418">memcpy で _Decimal128 に読み、z = x + y</text>
<text x="130" y="450" fill="#57606a">I128_* も同じ形。10進の値そのものは FFI を越えない</text>
</g>
</svg>
